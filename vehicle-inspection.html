<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>車両点検</title><link rel="stylesheet" href="vehicle-inspection.css"></head>
<body><div id="vehicleInspection" class="app">
<header><div><p class="eyebrow">MYGEOTAB ADD-IN</p><h1>車両点検</h1><p>点検結果はStorage API（AddInData）へ保存されます。</p></div><div id="apiState" class="pill pending">初期化中</div></header>
<nav><button data-view="form" class="active">点検入力</button><button data-view="history">点検履歴</button></nav>
<main>
<section id="formView">
<div class="card grid3"><label>車両<select id="vehicle"></select></label><label>点検者<input id="inspector" autocomplete="name"></label><label>点検日時<input id="inspectionDate" type="datetime-local"></label></div>
<div class="progress-row"><strong>点検進捗</strong><span id="progressText">0 / 13</span></div><div class="progress"><span id="progressBar"></span></div>
<div id="checklist"></div>
<div class="card"><label>総合コメント<textarea id="generalComment" rows="4" placeholder="異常箇所や対応内容"></textarea></label></div>
<div id="summary" class="summary pending"><div><strong id="summaryTitle">未完了</strong><p id="summaryText">すべての項目を確認してください。</p></div><div class="actions"><button id="clearBtn" class="secondary">クリア</button><button id="saveBtn" disabled>点検結果を保存</button></div></div>
<div id="message" role="status" aria-live="polite"></div>
</section>
<section id="historyView" hidden><div class="card filters"><input id="search" placeholder="車両名・点検者で検索"><select id="statusFilter"><option value="ALL">すべて</option><option value="OK">正常</option><option value="NG">異常あり</option></select><button id="reloadBtn">再読込</button></div><div class="table-wrap"><table><thead><tr><th>点検日時</th><th>車両</th><th>点検者</th><th>結果</th><th>コメント</th></tr></thead><tbody id="historyBody"></tbody></table></div></section>
</main></div><script src="vehicle-inspection.js"></script></body></html>
